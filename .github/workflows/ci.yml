name: CI
on:
  push:
  pull_request:

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Typecheck
        run: uv run mypy
      - name: Canonical imports
        run: uv run python scripts/check_canonical_imports.py
      - name: Frozen manifests
        run: uv run python -m charmdb.protocol experiments/thesis/manifests
      - name: Frozen input hashes
        run: uv run python scripts/check_frozen_inputs.py
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Build wheel and sdist
        run: uv build
