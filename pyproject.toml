[project]
name = "charm-db"
version = "0.1.0"
description = "Contextual, Holistic, Adaptive, Risk-aware, Multi-fidelity PostgreSQL tuning"
requires-python = ">=3.12,<3.14"
dependencies = [
  "botorch>=0.17,<0.18",
  "fastapi>=0.116,<0.118",
  "psycopg[binary]>=3.2.9,<3.4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "river>=0.22,<0.24",
  "scikit-learn>=1.8,<2",
  "typer>=0.16,<0.21",
  "uvicorn>=0.35,<0.39",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.17,<1.20",
  "pillow>=12.3,<13",
  "pytest>=8.4,<9.1",
  "pytest-cov>=6.2,<8",
  "python-docx>=1.2,<2",
  "ruff>=0.12,<0.16",
]

[project.scripts]
charmdb = "charmdb.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmdb"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["charmdb"]
