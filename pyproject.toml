[project]
name = "charm-db"
version = "0.1.0"
description = "Contextual, Holistic, Adaptive, Risk-aware, Multi-fidelity PostgreSQL tuning"
requires-python = ">=3.12,<3.14"
dependencies = [
  "botorch>=0.17,<0.18",
  "numpy>=2.5,<2.6",
  "psycopg[binary]>=3.2.9,<3.4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "scipy>=1.18,<1.19",
  "torch>=2.13,<2.14",
  "typer>=0.16,<0.21",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<1.20",
  "pytest>=8.4,<9.1",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<0.16",
]
docs = [
  "pillow>=12.3,<13",
  "python-docx>=1.2,<2",
]

[project.scripts]
charmdb = "charmdb.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmdb"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs/history",
  "/experiments/historical/authored-scripts",
  "/experiments/thesis/archive/docx",
  "/results",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["charmdb"]
