<text x="650.00" y="118.00" font-size="16" text-anchor="start">B  Conservative promotion</text>
<text x="650.00" y="154.00" font-size="13" text-anchor="start">Retrospective 60 s</text>
<rect x="650" y="170" width="420.8994708994709" height="22" fill="#0072B2"/>
<rect x="1070.899470899471" y="170" width="9.1005291005291" height="22" fill="#D55E00"/>
<text x="650.00" y="213.00" font-size="12" text-anchor="start">370/378 promoted; 8 rejected</text>
<text x="650.00" y="249.00" font-size="13" text-anchor="start">Retrospective 120 s</text>
<rect x="650" y="265" width="428.8624338624339" height="22" fill="#0072B2"/>
<rect x="1078.8624338624338" y="265" width="1.1375661375661494" height="22" fill="#D55E00"/>
<text x="650.00" y="308.00" font-size="12" text-anchor="start">377/378 promoted; 1 rejected</text>
<text x="650.00" y="344.00" font-size="13" text-anchor="start">Live demonstration</text>
<rect x="650" y="360" width="415.6666666666667" height="22" fill="#0072B2"/>
<rect x="1065.6666666666667" y="360" width="14.33333333333333" height="22" fill="#D55E00"/>
<text x="650.00" y="403.00" font-size="12" text-anchor="start">29/30 promoted; 1 rejected</text>
<text x="650.00" y="460.00" font-size="12" text-anchor="start">Blue: promoted   Orange: rejected</text>
<text x="100.00" y="535.00" font-size="16" text-anchor="start">C  Primary evaluation lifecycle limits savings</text>
<rect x="100.0" y="560" width="266.6414869788386" height="34" fill="#332288"/>
<text x="233.32" y="620.00" font-size="13" text-anchor="middle">Restore: 26.7%</text>
<rect x="366.6414869788386" y="560" width="360.55822030970796" height="34" fill="#0072B2"/>
<text x="546.92" y="620.00" font-size="13" text-anchor="middle">Measurement: 36.1%</text>
<rect x="727.1997072885465" y="560" width="372.8002927114534" height="34" fill="#D55E00"/>
<text x="913.60" y="620.00" font-size="13" text-anchor="middle">Warm-up + other: 37.3%</text>
<text x="100.00" y="664.00" font-size="18" text-anchor="start">Live savings: 540 s / 0.946% of matched all-F3 lifecycle</text>
<text x="100.00" y="695.00" font-size="13" text-anchor="start">The matched all-F3 denominator is recorded accounting, not an executed comparison.</text>
<text x="40.00" y="753.00" font-size="12" text-anchor="start">Retrospective: 378 physical candidates, three seeds; zero top-quartile false rejections at the registered 0.8 TPS floor.</text>
<text x="40.00" y="771.00" font-size="12" text-anchor="start">Live: one seed, fixed Sobol design, 30 candidates + five controls. The rejected candidate has no observed F3 outcome.</text>
<text x="40.00" y="789.00" font-size="12" text-anchor="start">Lifecycle: 655 successful primary trials, each counted once. Other includes configured 600 s warm-up; failed attempts/idle gaps excluded.</text>
<text x="40.00" y="807.00" font-size="12" text-anchor="start">Promotion counts are descriptive. Retrospective and live scopes are separate; neither is a five-seed fidelity experiment.</text>
</svg>
