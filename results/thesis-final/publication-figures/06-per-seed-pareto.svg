<text x="700.00" y="886.00" font-size="12" text-anchor="start">Shared initialization: one dark diamond, measured once.</text>
<text x="700.00" y="912.00" font-size="12" text-anchor="start">Point IDs link to the configuration/objective CSV.</text>
<text x="700.00" y="938.00" font-size="12" text-anchor="start">Common axes; fronts are not pooled across seeds.</text>
<text x="700.00" y="964.00" font-size="12" text-anchor="start">Segments show observed alternatives, not an interpolated model.</text>
<text x="40.00" y="1084.00" font-size="12" text-anchor="start">Frontier membership uses raw TPS/p99. It does not remove within-seed drift or establish statistical superiority.</text>
<text x="40.00" y="1102.00" font-size="12" text-anchor="start">No knee or composite winner is selected. Full normalized configurations and local-control contrasts are in pareto-configurations.csv.</text>
